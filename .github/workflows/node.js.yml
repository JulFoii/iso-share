name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 = untere Grenze aus package.json "engines" (LTS), 24 = was das
        # Docker-Image ausliefert
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax-Check
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t iso-share:ci .
      - name: Keine Laufzeitdaten im Image
        run: |
          docker run --rm --entrypoint sh iso-share:ci -c \
            'test ! -e /app/.env && test -z "$(ls -A /app/data)" && test -z "$(ls -A /app/uploads)" && test ! -e /app/test'
      - name: Smoke-Test gegen /healthz
        run: |
          docker run -d --name iso-share-smoke -p 3000:3000 \
            -e TRUST_PROXY=1 -e METRICS_TOKEN=ci iso-share:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/metrics)" = 401
          curl -fsS -H 'Authorization: Bearer ci' http://localhost:3000/metrics | grep -q iso_share_build_info
          # Geordnetes Herunterfahren: Exit-Code 0 nach SIGTERM
          docker stop -t 40 iso-share-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' iso-share-smoke)" = 0
      - name: Container-Log bei Fehler
        if: failure()
        run: docker logs iso-share-smoke || true
      - name: Image-Scan (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: iso-share:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
