version: '3.8'

services:
  iso-share:
    build: .
    container_name: iso-share-app
    ports:
      - "3000:3000"
    volumes:
      - ./uploads:/app/uploads
      - iso-share-sessions:/tmp/sessions
    environment:
      - NODE_ENV=production
      # Ohne gesetzte Werte generiert der Server sichere Zufallswerte und loggt
      # das Admin-Passwort einmalig. Für feste Zugangsdaten hier bzw. per .env
      # setzen — keine schwachen Platzhalter mehr.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  iso-share-sessions:
    driver: local